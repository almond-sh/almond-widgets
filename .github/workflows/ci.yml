name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8.2.0
    # Unit tests and tests running widgets in the kernel, for all the Scala versions of
    # ScalaVersions.tests
    - run: ./mill -i __.testForked

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8.2.0
    - run: ./mill -i mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll

  publish:
    needs: [test, format]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # packages: write to publish to GitHub Packages
    permissions:
      contents: read
      packages: write
    # Never run two SonatypeCentralPublishModule uploads at the same time
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8.2.0
    # On tags, the bundle is uploaded and validated on Sonatype Central, but has to be published
    # manually from https://central.sonatype.com/publishing/deployments. On branches, we delete
    # the tags of the current commit, so that we publish a snapshot (see buildVersion in
    # build.mill).
    - name: Publish to Sonatype Central
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "almond-widgets-${GITHUB_REF#refs/tags/v}" --shouldRelease false
        else
          for tag in $(git tag --points-at HEAD); do
            git tag -d "$tag"
          done
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
      shell: bash
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY_BASE64 }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    # Same artifacts (all the PublishModule ones, snapshots included) to GitHub Packages. Best
    # effort: Sonatype Central is the source of truth.
    - name: Publish to GitHub Packages
      continue-on-error: true
      run: |
        ./mill -i mill.javalib.MavenPublishModule/publishAll \
          --publishArtifacts "__:PublishModule.publishArtifacts" \
          --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
          --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
      shell: bash
      env:
        MILL_MAVEN_USERNAME: ${{ github.actor }}
        MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
