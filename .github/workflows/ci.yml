name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8.2.0
    # Unit tests and tests running widgets in the kernel, for all the Scala versions of
    # ScalaVersions.tests
    - run: ./mill -i __.testForked

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8.2.0
    - run: ./mill -i mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll

  publish:
    needs: [test, format]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never run two SonatypeCentralPublishModule uploads at the same time
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: coursier/cache-action@v8.2.0
    - run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "almond-widgets-${GITHUB_REF#refs/tags/v}"
        else
          ./mill -i mill.scalalib.SonatypeCentralPublishModule/
        fi
      shell: bash
      env:
        MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY_BASE64 }}
        MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
        MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
